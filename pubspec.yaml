name: nutrivia_app
description: "Nutrivia: Multilingual midlife health & nutrition companion for Indian women."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  fl_chart: ^1.3.0
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.5.0
  http: ^1.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/clinical_rules/
    - assets/data/
